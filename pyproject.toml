[project]
name = "anemone-db-api"
version = "0.1.0"
description = "API for ANEMONE DB"
readme = "README.md"
authors = [
    { name = "Watal M. Iwasaki", email = "heavywatal@users.noreply.github.com" }
]
license = { file = "LICENSE" }
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.135.2",
    "polars>=1.39.3",
]

[dependency-groups]
dev = [
    "ruff>=0.15.8",
]

[build-system]
requires = ["uv_build>=0.10.10,<1.0.0"]
build-backend = "uv_build"

[tool.pyright]
typeCheckingMode = "strict"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D1",   # missing docstring
  "D203", # incompatible
  "D213", # incompatible
  "ANN401", # Any
  "T201", # print
  "S101", # assert
  "DTZ",  # timezone
  "COM812", # trailing comma
  "TD",   # todo
  "FIX",  # todo
]
